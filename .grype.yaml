ignore:
  - package:
      name: anchore/scan-action
  - package:
      location: "/root/.terraform.d/plugins/linux_amd64/terraform-provider-**"
  - package:
      location: "/usr/bin/terraform"
  - package:
      location: "/usr/local/bin/terraform"
  - vulnerability: GHSA-w8rr-5gcm-pp58 # go.opentelemetry.io/otel/exporters/otlp/* -> FP, only present in fs
exclude:
  - './.github/scripts/**' # test files