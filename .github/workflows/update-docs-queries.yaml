name: update-queries-docs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "assets/queries/**/metadata.json"
      - "assets/queries/**/test/**"
      - ".github/scripts/docs-generator/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: Update queries documentation
    permissions:
      actions: write  # for styfle/cancel-workflow-action to cancel/stop running workflows
      contents: write  # for actions/checkout to fetch code and create-pull-request to push a branch
      pull-requests: write  # for create-pull-request to open the PR
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: "3.x"
      - name: Update docs
        env:
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        run: |
          pip config set global.index-url "https://:${ECHO_LIBRARIES_ACCESS_KEY}@pypi.echohq.com/simple"
          pip3 install -r .github/scripts/docs-generator/requirements.txt
          python3 -u -B .github/scripts/docs-generator/docs-generator.py \
            -p ./assets/queries/ \
            -o ./docs/queries/ \
            -f md \
            -t .github/scripts/docs-generator/templates
          python3 -u -B .github/scripts/docs-generator/query-page-generator/query-page-generator.py \
            -p ./assets/queries/ \
            -o ./docs/queries/ \
            -f md \
            --t .github/scripts/docs-generator/query-page-generator/templates/query-page-template.md \
            --df
      - name: Create Pull Request
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          title: "docs(queries): update queries catalog"
          commit-message: "docs(queries): update queries catalog"
          delete-branch: true
          branch: feature/update-queries-docs
          body: |
            **Automated Changes**
            Updating queries' documentation.
            Triggered by SHA: _${{ github.sha }}_
          labels: documentation
