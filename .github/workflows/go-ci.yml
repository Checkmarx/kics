name: go-ci

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # for actions/checkout to fetch code

jobs:
  lint:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for step-security/golangci-lint-action to post PR review comments
    name: lint (golangci-lint)
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: step-security/golangci-lint-action@1797facf9ea427614d729a4e9cab0fae1a7852d9 # v9.2.0
        with:
          version: v2.11.3
          args: -c .golangci.yml --timeout 20m

  go-generate:
    name: go-generate
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read  # for actions/checkout to fetch code
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Generate mocks and marshall/unmarshall code
        run: make generate

  unit-tests:
    name: unit-tests
    permissions:
      contents: read  # for actions/checkout and actions/cache
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [cx-public-ubuntu-x64, cx-public-ubuntu-arm64, cx-public-windows-2022-x64, cx-public-macos-arm64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Harden Runner (macOS only)
        if: matrix.os == 'cx-public-macos-arm64'
        uses: checkmarx/harden-runner-action@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Get cache paths
        id: go-cache-paths
        shell: bash
        run: echo "GO_BUILD=$(go env GOCACHE)" >>$GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.go-cache-paths.outputs.GO_BUILD }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.OS }}-build-${{ env.cache-name }}
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-
      - name: Get Modules
        run: |
          go mod vendor
      - name: Set Windows Page size
        if: matrix.os == 'cx-public-windows-2022-x64'
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "C:"
      - name: Test and Generate Report Dev
        if: matrix.os != 'cx-public-windows-2022-x64'
        run: |
          go test -tags dev -mod=vendor -v -timeout 2100s $(go list -tags dev ./... | grep -v e2e) -count=1 -coverprofile=cover.out | tee unit-test.log
          result_code=${PIPESTATUS[0]}
          exit $result_code
      - name: Exclude Go temp dir from Windows Defender
        if: matrix.os == 'cx-public-windows-2022-x64'
        shell: powershell
        run: Add-MpPreference -ExclusionPath $env:TEMP
      - name: Test and Generate Report Windows Dev
        if: matrix.os == 'cx-public-windows-2022-x64'
        shell: powershell
        run: |
          go test -mod=vendor -tags dev -v -timeout 2100s $(go list -tags dev ./... | grep -v e2e) -count=1 -coverprofile=cover.out | Tee-Object unit-test.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $realFailure = Select-String -Path unit-test.log -Pattern '^(--- FAIL|FAIL\s|panic:)' -Quiet
            if ($realFailure) {
              exit $exitCode
            }
            Write-Warning "go test exited $exitCode with no FAIL/panic in output - treating as the known Windows 'go: unlinkat ...: Access is denied' cleanup flake."
            exit 0
          }
      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}.log
          path: unit-test.log

  validate-search-line:
    name: validate-search-line
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read  # for actions/checkout to fetch code
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed query.rego files
        uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        id: filter
        with:
          list-files: json
          filters: |
            queries:
              - 'assets/queries/**/query.rego'
      - name: Debug filter outputs
        env:
          QUERIES_FILTER: ${{ steps.filter.outputs.queries }}
          CHANGED_QUERIES: ${{ steps.filter.outputs.queries_files }}
        run: |
          echo "queries changed: ${QUERIES_FILTER}"
          echo "changed files: ${CHANGED_QUERIES}"
      - name: Setup Python
        id: setup-python
        if: steps.filter.outputs.queries == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Validate searchLine in modified queries
        if: steps.setup-python.outcome == 'success'
        env:
          KICS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KICS_PR_NUMBER: ${{ github.event.number }}
        working-directory: .github/scripts/validate-search-line/
        run: python3 validate_search_line.py

  security-scan:
    name: security-scan
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read  # for actions/checkout to fetch code
      security-events: write  # for github/codeql-action/upload-sarif to upload scan results
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run Gosec Security Scanner
        uses: securego/gosec@d2d3ae66bd8d340b78b5142b6fe610691783c2fe # v2.22.5
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
      - name: Show results
        run: |
          cat results.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@4c3e5362829f0b0bb62ff5f6c938d7f95574c306
        with:
          sarif_file: results.sarif
