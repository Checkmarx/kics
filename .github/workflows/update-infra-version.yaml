name: update-infra-version

on:
  workflow_dispatch:
  release:
    type: [published]

permissions:
  contents: read

jobs:
  update-infra-version:
    name: Updates infra with new release
    runs-on: cx-public-ubuntu-x64
    if: "!github.event.release.prerelease"
    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Generate KICS Bot token
        id: kics-bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 #v3.1.1
        with:
          client-id: ${{ vars.GH_APP_KICSAPP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KICSAPP_PRIVATE_KEY }}
      - name: Update Terraform Cloud Integration
        uses: step-security/repository-dispatch@1a81ac1c72a4ad222c516293b6adf56b34c4cffd # v4.0.2
        with:
          token: ${{ steps.kics-bot-token.outputs.token }}
          repository: ${{ secrets.TFC_REPO_PATH }}
          event-type: new-release
      - name: Update Infra
        uses: step-security/repository-dispatch@1a81ac1c72a4ad222c516293b6adf56b34c4cffd # v4.0.2
        with:
          token: ${{ steps.kics-bot-token.outputs.token }}
          repository: ${{ secrets.INFRA_REPO }}
          event-type: new-release
