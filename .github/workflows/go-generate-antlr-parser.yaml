name: go-generate-antlr-parser

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pkg/parser/jsonfilter/JSONFilter.g4"
permissions:
  contents: read

jobs:
  metrics:
    name: generate-antlr-parser
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build ANTLR image
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        id: build_antlr_image
        with:
          context: .
          push: false
          tags: antlr4-generator:dev
      - name: Generate Parser
        run: |
          docker run --rm -u $(id -u ${USER}):$(id -g ${USER}) -v $(pwd)/pkg/parser/jsonfilter:/work -it antlr4-generator:dev
      - name: Generate KICS Bot token
        id: kics-bot-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 #v3.1.1
        with:
          client-id: ${{ vars.GH_APP_KICSAPP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_KICSAPP_PRIVATE_KEY }}
      - name: Create Pull Request
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          title: "chore(parser): updating AWS jsonfilter ANTLR generated parser"
          token: ${{ steps.kics-bot-token.outputs.token }}
          commit-message: "chore(parser): updating AWS jsonfilter ANTLR generated parser"
          delete-branch: true
          branch: feature/kicsbot-update-jsonfilter-parser
          body: |
            **Automated Changes**
            Updating ANTLR generated parser after grammar changes
            Triggered by SHA: _${{ github.sha }}_
          labels: go
