name: validate-arm-samples

on:
  pull_request:
    paths:
      - "assets/queries/azureResourceManager/**/test/*.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-json-samples:
    name: Lint ARM JSON Samples
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version: "20"
      - name: Installing jsonlint
        run: | # zizmor: ignore[adhoc-packages] single small CLI lint tool pinned to an exact version, not a project dependency warranting its own lockfile
          npm install -g --ignore-scripts jsonlint@1.6.3
      - name: Running JSON lint
        run: |
          python3 -u ".github/scripts/samples-linters/validate-syntax.py" \
            "assets/queries/azureResourceManager/**/test/*.json" \
            --linter jsonlint \
            --skip ".github/scripts/samples-linters/ignore-list/arm" -vv
