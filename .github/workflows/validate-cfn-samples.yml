name: validate-cfn-samples

on:
  pull_request:
    paths:
    - "assets/queries/cloudFormation/**/test/*.yaml"
    - "assets/queries/cloudFormation/**/test/*.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # for actions/checkout to fetch code

jobs:
  validate-cfn-syntax:
    name: Validate Cloudformation Syntax
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changed cloudformation samples
        uses: step-security/paths-filter@5c5241b8233e77b55b9046daf88f1cb7560281de # v4.0.1
        id: filter
        with:
          list-files: json
          filters: |
            samples:
              - "assets/queries/cloudFormation/**/test/*.yaml"
              - "assets/queries/cloudFormation/**/test/*.json"
      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Get cfn-python-lint
        env:
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        run: |
          pip config set global.index-url "https://:${ECHO_LIBRARIES_ACCESS_KEY}@pypi.echohq.com/simple"
          pip3 install -U cfn-lint --user
      - name: Validate changed cloudformation template samples
        env:
          CHANGED_SAMPLES: ${{ steps.filter.outputs.samples_files }}
        run: |
          echo "${CHANGED_SAMPLES}" > "${RUNNER_TEMP}/changed-cfn-samples.json"
          python3 -u .github/scripts/samples-linters/validate-syntax.py \
            "assets/queries/cloudFormation/**/test/*.yaml" \
            "assets/queries/cloudFormation/**/test/*.json" \
            --diff "${RUNNER_TEMP}/changed-cfn-samples.json" \
            --linter /home/runner/.local/bin/cfn-lint \
            --extra " --info --config-file .github/scripts/samples-linters/.cfnlintrc.yml" \
            --skip ".github/scripts/samples-linters/ignore-list/cloudformation" \
            --verbose
