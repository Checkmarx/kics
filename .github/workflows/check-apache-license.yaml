name: check-apache-license
on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-apache-license-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-license:
    runs-on: cx-public-ubuntu-x64
    timeout-minutes: 1
    env:
      BODY: ${{ github.event.pull_request.body }}
      USERNAME: ${{ github.event.pull_request.user.login }}
      KICS_BOT_PAT: ${{ secrets.KICS_BOT_PAT }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        sparse-checkout: |
          .github/scripts/pr-issue-info/apache-check.md
    - name: Check for Apache License
      if: env.USERNAME != 'kicsbot' && env.USERNAME != 'dependabot[bot]'
      run: |
        echo "$BODY" | grep -iPq "^I submit this contribution under the Apache-2.0 license.$" || echo "CHECK_FAILED=true" >> $GITHUB_ENV
    - name: Check for comment tag
      if: env.CHECK_FAILED != 'true'
      run: |
        comments=$(curl -s -H "Authorization: token ${{ KICS_BOT_PAT }}" \
            -X GET "https://api.github.com/repos/${{ REPOSITORY }}/issues/${{ PR_NUMBER }}/comments")
        if echo "$comments" | grep -q "apache_license"; then
          echo "TAG_EXISTS=true" >> $GITHUB_ENV
        else
          echo "TAG_EXISTS=false" >> $GITHUB_ENV
        fi
    - name: Delete comment if license is fixed
      if: env.TAG_EXISTS == 'true'
      uses: step-security/actions-comment-pull-request@60cd38988a354b2d22b47612fb02a20e822d6048 # v3.0.2
      with:
        message: |
          Deleting comment...
        comment-tag: apache_license
        mode: delete
        github-token: ${{ KICS_BOT_PAT }}
    - name: Add comment if no license
      if: env.CHECK_FAILED == 'true'
      uses: step-security/actions-comment-pull-request@60cd38988a354b2d22b47612fb02a20e822d6048 # v3.0.2
      with:
        file-path: .github/scripts/pr-issue-info/apache-check.md
        comment-tag: apache_license
        mode: recreate
        create-if-not-exists: true
        github-token: ${{ KICS_BOT_PAT }}
    - name: Workflow failed
      if: env.CHECK_FAILED == 'true'
      run: exit 1
