name: goreleaser-scheduled

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # default deny-write baseline; jobs below elevate as needed

jobs:
  pre_release_job:
    name: Pre Release Job
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read # for actions/checkout to fetch code
    outputs:
      changes: ${{ steps.lasttag.outputs.newchanges }}
      sha8: ${{ steps.shorthash.outputs.sha8 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if there are new commits since last nightly
        id: lasttag
        run: echo "::set-output name=newchanges::$(bash ./.github/scripts/is-changed-since-last-nightly.sh)"
      - name: Set short hash
        id: shorthash
        run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

  goreleaser:
    name: Go Releaser
    needs: pre_release_job
    if: ${{ needs.pre_release_job.outputs.changes == 'yes' }}
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write # to create/delete the nightly release and upload its assets
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Teams Notification channel
        uses: toko-bifrost/ms-teams-deploy-card@dcc94e4ce4088b1e6b6de5c9a3cda4ddcbe97d2e # 3.1.2
        if: always()
        with:
          github-token: ${{ secrets.KICS_BOT_PAT }}
          webhook-uri: ${{ secrets.MSTEAMS_WEBHOOK_URL }}
          card-layout-start: cozy
          card-layout-exit: complete
          show-on-start: true
          show-on-exit: true
          custom-facts: |
            - name: Nightly Release Commit
              value: ${{ needs.pre_release_job.outputs.sha8 }}
          custom-actions: |
            - name: View CI Logs
              value: https://github.com/Checkmarx/kics/actions/runs/${{ github.run_id }}"
            - name: View HEAD Commit
              value: https://github.com/Checkmarx/kics/commit/${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.x
      - name: Run GoReleaser
        uses: step-security/goreleaser-action@1472c46ac6e641f2b929f1a893354288b3a6b6b6 # v7.2.1
        with:
          version: v0.160.0
          args: release --rm-dist --snapshot --skip-validate --config="./release/.goreleaser-nightly.yml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DESCRIPTIONS_URL: ${{ secrets.DESCRIPTIONS_URL }}
      - name: delete release
        uses: dev-drprasad/delete-tag-and-release@82600feb9527126eca69833f07bafe53279bd9b4 # v1.1
        with:
          delete_release: true # default: false
          tag_name: nightly # tag name to delete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Display assets
        run: |
          ls -l /home/runner/work/kics/kics/dist
      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA8: ${{ needs.pre_release_job.outputs.sha8 }}
        run: |
          gh release create nightly \
            --title "nightly-${SHA8}" \
            --prerelease \
            --notes "" \
            /home/runner/work/kics/kics/dist/kics_nightly_linux_x64.tar.gz#kics_nightly-release_linux_amd64.tar.gz \
            /home/runner/work/kics/kics/dist/kics_nightly_darwin_x64.tar.gz#kics_nightly-release_darwin_amd64.tar.gz \
            /home/runner/work/kics/kics/dist/kics_nightly_windows_x64.zip#kics_nightly-release_windows_amd64.zip \
            /home/runner/work/kics/kics/dist/kics_nightly_checksums.txt#kics_nightly-release_checksums.txt
  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: pre_release_job
    if: ${{ needs.pre_release_job.outputs.changes == 'yes' }}
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write # for create-pull-request to push a branch
      pull-requests: write # for create-pull-request to open the PR
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: toko-bifrost/ms-teams-deploy-card@dcc94e4ce4088b1e6b6de5c9a3cda4ddcbe97d2e # 3.1.2
        if: always()
        with:
          github-token: ${{ secrets.KICS_BOT_PAT }}
          webhook-uri: ${{ secrets.MSTEAMS_WEBHOOK_URL }}
          card-layout-start: cozy
          card-layout-exit: complete
          show-on-start: true
          show-on-exit: true
          custom-facts: |
            - name: Nightly Release Commit
              value: ${{ needs.pre_release_job.outputs.sha8 }}
          custom-actions: |
            - name: View CI Logs
              value: https://github.com/Checkmarx/kics/actions/runs/${{ github.run_id }}"
            - name: View HEAD Commit
              value: https://github.com/Checkmarx/kics/commit/${{ github.sha }}
      - name: Set up QEMU
        uses: step-security/setup-qemu-action@109c6ed9f089be1a250c75fd6a534e30df44e030 # v4.0.0
        with:
          image: tonistiigi/binfmt:latest
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Login to DockerHub
        uses: step-security/docker-login-action@870af644803bf9f204aed474adbad2958fec048b # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get current date
        run: echo "CREATED_AT=$(date --rfc-3339=seconds)" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: "checkmarx/kics"
          labels: |
            org.opencontainers.image.title=KICS
            org.opencontainers.image.version=nightly-${{ needs.pre_release_job.outputs.sha8 }}
            org.opencontainers.image.vendor=Checkmarx
            org.opencontainers.image.authors=KICS
            org.opencontainers.image.description=Find security vulnerabilities, compliance issues, and infrastructure misconfigurations early in the development cycle of your infrastructure-as-code with KICS by Checkmarx.
            org.opencontainers.image.documentation=https://docs.kics.io
            org.opencontainers.image.url=https://github.com/Checkmarx/kics
            org.opencontainers.image.source=https://github.com/Checkmarx/kics
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.CREATED_AT }}
      - name: Push main to Docker Hub
        id: build_main
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: checkmarx/kics:nightly
          build-args: |
            VERSION=nightly-${{ needs.pre_release_job.outputs.sha8 }}
            COMMIT=${{ github.sha }}
            DESCRIPTIONS_URL=${{ secrets.DESCRIPTIONS_URL }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push alpine to Docker Hub
        id: build_alpine
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./docker/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/arm64
          tags: checkmarx/kics:nightly-alpine
          build-args: |
            VERSION=nightly-${{ needs.pre_release_job.outputs.sha8 }}
            COMMIT=${{ github.sha }}
            DESCRIPTIONS_URL=${{ secrets.DESCRIPTIONS_URL }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push debian to Docker Hub
        id: build_debian
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./docker/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/arm64
          tags: checkmarx/kics:nightly-debian
          build-args: |
            VERSION=nightly-${{ needs.pre_release_job.outputs.sha8 }}
            COMMIT=${{ github.sha }}
            DESCRIPTIONS_URL=${{ secrets.DESCRIPTIONS_URL }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push ubi8 to Docker Hub
        id: build_ubi8
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: .
          file: ./docker/Dockerfile.ubi8
          push: true
          tags: checkmarx/kics:nightly-ubi8
          platforms: linux/amd64
          build-args: |
            VERSION=nightly-${{ needs.pre_release_job.outputs.sha8 }}
            COMMIT=${{ github.sha }}
            DESCRIPTIONS_URL=${{ secrets.DESCRIPTIONS_URL }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create Pull Request
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          title: "docs(kicsbot): update images digest"
          token: ${{ secrets.KICS_BOT_PAT }}
          commit-message: "docs(kicsbot): update images digest"
          delete-branch: true
          branch: feature/kicsbot-update-queries-docs
          body: |
            **Automated Changes**
            Updating docker images digests
            Triggered by SHA: _${{ github.sha }}_
          labels: documentation
