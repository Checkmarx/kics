name: validate-queries-metadata

on:
  pull_request:
    paths:
    - "assets/queries/**/metadata.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # for actions/checkout to fetch code

jobs:
  validate-metadata:
    name: Validate Queries Metadata
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # queries-validator.py reads the PR's changed file list via the GitHub API
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run queries metadata validation script
        env:
          KICS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KICS_PR_NUMBER: ${{ github.event.number }}
          ECHO_LIBRARIES_ACCESS_KEY: ${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}
        id: validator
        working-directory: .github/scripts/queries-validator/
        run: |
          pip config set global.index-url "https://:${ECHO_LIBRARIES_ACCESS_KEY}@pypi.echohq.com/simple"
          pip3 install -r requirements.txt
          python3 queries-validator.py
