name: validate-openapi-samples

on:
  pull_request:
    paths:
    - "assets/queries/openAPI/**/test/*.yaml"
    - "assets/queries/openAPI/**/test/*.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-yaml-samples:
    name: Validate Yaml samples
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: yaml-lint
        uses: step-security/action-yamllint@f6001007aa934824354a24f099a6f97cf6472e15 # v3.1.1
        with:
          file_or_dir: assets/queries/openAPI/
          config_file: .github/scripts/samples-linters/yamllint.yml
          strict: true

  lint-json-samples:
    name: Validate json samples
    runs-on: cx-public-ubuntu-x64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6.3.0
        with:
          node-version: '20'
      - name: Installing jsonlint
        run: | # zizmor: ignore[adhoc-packages] single small CLI lint tool pinned to an exact version, not a project dependency warranting its own lockfile
          npm install -g --ignore-scripts jsonlint@1.6.3
          npm show jsonlint
          which jsonlint
      - name: Running JSON lint
        run: |
          python3 -u ".github/scripts/samples-linters/validate-syntax.py" \
            "assets/queries/openapi/**/test/*.json" \
            --linter jsonlint \
            --skip ".github/scripts/samples-linters/ignore-list/openapi" -vv


