# Safe: pull_request trigger (not pull_request_target) runs in an unprivileged,
# sandboxed context without access to repository secrets. The credential
# exposure risk is much lower than with pull_request_target.

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: make test
