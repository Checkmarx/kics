# pull_request (not pull_request_target) with workflow-level write permissions.
# Since pull_request does not run with the target repo's elevated permissions,
# this pattern is outside the scope of this query.

name: CI on Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: make build

      - name: Post status comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: Build succeeded.
