name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  changed_files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files (patched major version)
        uses: tj-actions/changed-files@v46

      - name: Get changed files (patched version)
        uses: tj-actions/changed-files@v46.0.1

      - name: Get changed files (first safe version after the boundary)
        uses: tj-actions/changed-files@v45.1.0

      - name: An unrelated action should never be flagged
        uses: actions/setup-node@v4
