version: "3.4"
services:
  service-service-service:
    build:
      context: ./
      dockerfile: service.dockerfile
    ports:
      - "6969:8080"
    networks:
      - service-service-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
  service-with-equals-separator:
    image: example:latest
    security_opt:
      - no-new-privileges=true
  service-with-implicit-boolean:
    image: example:latest
    security_opt:
      - no-new-privileges

networks:
  service-service-frontend:
