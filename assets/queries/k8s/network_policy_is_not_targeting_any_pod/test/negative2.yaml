apiVersion: v1
kind: Pod
metadata:
  name: api-backend
  namespace: demo
  labels:
    app: api
    tier: backend
spec:
  containers:
    - name: app
      image: example.invalid/app:1
---
apiVersion: v1
kind: Pod
metadata:
  name: api-frontend
  namespace: demo
  labels:
    app: api
    tier: frontend
spec:
  containers:
    - name: app
      image: example.invalid/app:1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-backend
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: api
      tier: backend
  policyTypes:
    - Ingress
  ingress: []
