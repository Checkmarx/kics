Resources:
  Prod:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: Prod
      Description: Prod Stage
      AccessLogSetting:
        DestinationArn: "dest"
        Format: "format"
      RestApiId: !Ref MyRestApi
      DeploymentId: !Ref TestDeployment
      DocumentationVersion: ""
      MethodSettings:
        - DataTraceEnabled: False
          LoggingLevel: "OFF"
        - DataTraceEnabled: False
          LoggingLevel: ""
        - LoggingLevel: "INFO"
          DataTraceEnabled: False
