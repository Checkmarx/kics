name: aws-eks
runtime: yaml
description: An EKS cluster
resources:
  exampleV2NoLevel:
    type: aws:apigatewayv2:Stage
    properties:
      apiId: ${aws_apigatewayv2_api.example.id}
      accessLogSettings:
        destinationArn: sampleArn
        format: CLF
      defaultRouteSettings:
        dataTraceEnabled: false
  exampleV2EmptyLevel:
    type: aws:apigatewayv2:Stage
    properties:
      apiId: ${aws_apigatewayv2_api.example.id}
      accessLogSettings:
        destinationArn: sampleArn
        format: CLF
      defaultRouteSettings:
        loggingLevel: ""
  exampleV1:
    type: aws:apigateway:Stage
    properties:
      restApiId: ${aws_api_gateway_rest_api.example.id}
      stageName: prod
      accessLogSettings:
        destinationArn: sampleArn
      methodSettings:
        - dataTraceEnabled: false
        - loggingLevel: ""
          dataTraceEnabled: false
