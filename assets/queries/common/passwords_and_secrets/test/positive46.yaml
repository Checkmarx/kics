# "Generic Password" - 487f4be7-3fd9-4506-a07a-eae252180c08  positive-test
version: '3.9'
services:
  vulnerable_node:
    restart: always
    build: .
    depends_on:
      - postgres_db
    ports:
      - "3000:3000"
    depends_on:
      - postgres_db

  postgres_db:
    restart: always
    build: ./services/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres  # positive1
      - POSTGRES_PASSWORD=string    # positive2
