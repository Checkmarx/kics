
apiVersion: v1
kind: Config
preferences: {}

clusters:
- cluster:
    certificate-authority-data: {{.CAData}}
    server: {{.Server}}
  name: sample-cluster

users:
- name: sample-admin
  user:
    as-user-extra: {}
    token: {{.Token}}

contexts:
- context:
    cluster: sample-cluster
    namespace: default
    user: sample-admin
  name: sample-ctx

current-context: sample-ctx
